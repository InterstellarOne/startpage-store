name: Update JSON files weekly

on: 
    schedule:
        - cron: "0 0 * * 0"
    workflow_dispatch:

jobs:
    setup:
        runs-on: ubuntu-latest
        outputs:
            files_matrix: ${{ steps.set-matrix.outputs.files }}
        steps:
    update_dates:
        name: Update Dates
        runs-on: ubuntu-latest
        steps:
            - name: Update Json File
              uses: restackio/update-json-file-action@2.1
              with:
                file: my-file.json
                field: dateUpdated
                value: {dateUpdated}








