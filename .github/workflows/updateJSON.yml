name: Update JSON files weekly

on: 
    schedule:
        - cron: "0 0 * * 0"
    workflow_dispatch:

jobs:
    update_dates:
        name: Update Dates
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24

            - name: Update Json Files
              run: node src/scripts/update-JSON.mjs
