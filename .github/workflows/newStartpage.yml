name: Validate submission and create new JSON entry for it

on: 
    issues:
      types: [opened]

jobs:
    create-json:
        if: contains(github.event.issue.labels.*.name, 'automation-trigger')

        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 24
            - name: Run Issue form parser
              id: parse
              uses: peter-murray/issue-forms-body-parser@v4.0.0
              with:
                issue_id: ${{ github.event.issue.number }}
                separator: '###'
                label_marker_start: '<'
                label_marker_end: '>'

            - name: Show parsed data JSON
              env:
                parsed_data: ${{ steps.parse.outputs.payload }}
              run: |
                echo "$parsed_data"

